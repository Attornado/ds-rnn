# Sparsity sensitivity: 75% of recurrent coordinates remain active.
# Dense is omitted because it is already measured by the primary config and is
# independent of the read/write sparsity arguments.
models: [read_only, write_only, dual]
hidden_size: 128
n_registers: 8
value_size: 4
read_sparsity: 0.25
write_sparsity: 0.25
router_context_size: 16
router_backward: ste
implementation: reference
n_train: 8192
n_val: 2048
n_test: 4096
batch_size: 128
epochs: 100
lr: 0.001
weight_decay: 0.0
early_stopping_patience: 15
seed: 42
split_seed: 2026
num_workers: 0
accelerator: auto
devices: "1"
log_dir: _results/selective_memory/sensitivity_active75_reference
