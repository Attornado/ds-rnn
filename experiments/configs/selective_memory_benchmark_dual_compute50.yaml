# Compute-matched control for the one-sided models in the primary config.
# With H=128, the primary read-only/write-only models use 64*128 = 8192
# recurrent interactions. This dual model uses 91*91 = 8281 (50.54% of H^2),
# the nearest symmetric integer READ/WRITE budget.
models: [dual]
hidden_size: 128
n_registers: 8
value_size: 4
read_sparsity: 0.2890625
write_sparsity: 0.2890625
router_context_size: 16
router_backward: ste
implementation: reference
n_train: 8192
n_val: 2048
n_test: 4096
batch_size: 128
epochs: 100
lr: 0.001
weight_decay: 0.0
lr_scheduler_patience: 5
early_stopping_patience: 15
seed: 43
split_seed: 2026
num_workers: 0
accelerator: auto
devices: "1"
log_dir: _results/selective_memory/dual_compute50_reference
