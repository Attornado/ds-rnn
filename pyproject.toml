[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-rnn"
version = "0.1.0"
description = "Dynamic Sparse Recurrent Neural Networks: input-conditioned subnetwork selection for RNNs and SSMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Andrea Terlizzi" },
]
keywords = ["recurrent-neural-networks", "dynamic-sparsity", "conditional-computation", "continual-learning"]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "einops>=0.7",
    # dsrnn.nn.cells.dsltc inherits from ncps.torch.LTCCell
    "ncps>=1.0",
    # dsrnn.nn.linear (TransposedLinear) uses opt_einsum.contract
    "opt-einsum>=3.3",
]

[project.optional-dependencies]
# Training loops and metrics for the benchmark experiments.
experiments = [
    "lightning>=2.2",
    "torchmetrics>=1.3",
]
# Datasets used by the benchmark suites.
data = [
    "torchvision>=0.16",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]
# Continual learning experiments (Avalanche-managed training loops).
cl = [
    "avalanche-lib>=0.5",
]
# Weight-watcher analysis callbacks.
ww = [
    "weightwatcher>=0.7",
]
# Logging (optional; experiments run fine without it).
wandb = [
    "wandb>=0.16",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["dsrnn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
