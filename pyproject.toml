[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-rnn"
version = "0.1.0"
description = "Dynamic Sparse Recurrent Neural Networks: input-conditioned subnetwork selection for RNNs and SSMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Andrea Terlizzi" },
]
keywords = ["recurrent-neural-networks", "dynamic-sparsity", "conditional-computation", "continual-learning"]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "einops>=0.7",
    "ncps>=1.0",
    "opt-einsum>=3.3",
    "scipy>=1.10",
    "pytest>=8.0",
]

[project.optional-dependencies]
experiments = [
    "lightning>=2.2",
    "torchmetrics>=1.3",
]
data = [
    "torchvision>=0.16",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "ucimlrepo>=0.7",
    "requests>=2.31",
    "pytorch-forecasting>=1.0",
]
# Analysis callbacks: sparsity-mask visualization and graph metrics.
analysis = [
    "matplotlib>=3.7",
    "networkx>=3.1",
    "imageio>=2.31",
]
# Continual learning experiments (Avalanche-managed training loops).
cl = [
    "avalanche-lib>=0.5",
]
# Weight-watcher analysis callbacks.
ww = [
    "weightwatcher>=0.7",
]
# Logging (optional; experiments run fine without it).
wandb = [
    "wandb>=0.16",
]

[tool.setuptools.packages.find]
include = ["dsrnn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
