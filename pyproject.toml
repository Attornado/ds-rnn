[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-rnn"
version = "0.1.0"
description = "Dynamic Sparse Recurrent Neural Networks: input-conditioned subnetwork selection for RNNs and SSMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Andrea Terlizzi" },
]
keywords = ["recurrent-neural-networks", "dynamic-sparsity", "conditional-computation", "continual-learning"]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Training loops, metrics and CLI for the benchmark experiments.
experiments = [
    "lightning>=2.2",
    "torchmetrics>=1.3",
    "jsonargparse[signatures]>=4.27",
]
# Datasets used by the benchmark suites.
data = [
    "torchvision>=0.16",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]
# Continual learning experiments (Avalanche-managed training loops).
cl = [
    "avalanche-lib>=0.5",
]
# Logging (optional; experiments run fine without it).
wandb = [
    "wandb>=0.16",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["dsrnn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
